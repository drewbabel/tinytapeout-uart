name: formal

env:
  OSS_CAD_SUITE: '2026-07-24'

on: [push, workflow_dispatch]
jobs:
  formal:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mod: [uart_tx, uart_rx]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup oss-cad-suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE }}

      - name: Run proofs
        run: sby -f formal/${{ matrix.mod }}.sby
